<div class="table-container">
  <table>
    <thead>
      <tr>
        <th (click)="sort('address')">
          Адрес назначения {{ getSortIcon("address") }}
        </th>
        <th (click)="sort('gateway')">Шлюз {{ getSortIcon("gateway") }}</th>
        <th (click)="sort('interface')">
          Интерфейс {{ getSortIcon("interface") }}
        </th>
      </tr>
    </thead>
    <tbody>
      @for (route of routes; track route.uuid) {
      <tr>
        <td>{{ route.address }}</td>
        <td>{{ route.gateway }}</td>
        <td>{{ route.interface }}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
